name: Tag engine

# Cuts engine-v<engineVersion> on master once a PR that bumps package.json's
# engineVersion lands. Does nothing if that tag already exists.

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag engine-v<engineVersion> if it's new
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").engineVersion')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json's engineVersion must be X.Y.Z; it's '$version'."
            exit 1
          fi
          tag="engine-v$version"
          # Exit code 2 means no such tag; anything else nonzero is a real error.
          exists() {
            local code=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || code=$?
            [ "$code" -eq 0 ] && return 0
            [ "$code" -eq 2 ] && return 1
            echo "::error::Couldn't list the remote's tags (git ls-remote exited $code)."
            exit 1
          }
          if exists; then
            echo "$tag already exists; nothing to tag."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          # Another push's run may have cut the tag in the meantime.
          if ! git push origin "refs/tags/$tag"; then
            exists && { echo "$tag was cut by another run."; exit 0; }
            exit 1
          fi
          echo "Tagged $GITHUB_SHA as $tag."
